# Run the wacli built from whatsapp-gui's vendored source instead of the packaged
# one: it carries two fixes the 0.18.1 package lacks — a failed message insert no
# longer advances chats.last_message_ts, and the failure is logged instead of
# silently discarded. Remove this file and `systemctl --user daemon-reload` to go
# back to /usr/bin/wacli.
[Service]
ExecStart=
ExecStart=%h/.local/bin/wacli sync --follow --presence-mode quiet
